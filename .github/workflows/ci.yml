name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The runtime image needs trained artifacts (not in git), so CI verifies the
      # dependency layers and the pipeline image build cleanly.
      - name: Build runtime dependencies
        run: docker buildx build --target runtime-deps .
      - name: Build pipeline image
        run: docker buildx build --target train .
