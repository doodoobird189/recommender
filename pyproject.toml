[project]
name = "recommender"
version = "0.2.0"
description = "Hybrid movie recommender: implicit ALS collaborative filtering + MovieLens tag-genome content model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scipy>=1.14",
]

[project.scripts]
recommender = "recommender.cli:main"

[dependency-groups]
# Only needed to build artifacts (prepare / train / evaluate) — not shipped in the runtime image.
train = [
    "implicit>=0.7.2",
    "threadpoolctl>=3.5",
]
dev = [
    "huggingface-hub>=2.4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["train", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recommender"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
