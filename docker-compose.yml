services:
  web:
    build:
      context: .
      target: runtime
    image: recommender:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # Offline pipeline: `docker compose run --rm pipeline all` (or prepare / train / evaluate)
  pipeline:
    build:
      context: .
      target: train
    image: recommender-pipeline:latest
    profiles: ["pipeline"]
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
