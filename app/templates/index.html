<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Recommender</title>
  <style>
    /* ── reset & base ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0f;
      color: #e8e8ea;
      min-height: 100vh;
    }

    /* ── header ─────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      border-bottom: 1px solid #1e3a5f;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      margin-top: 0.4rem;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* ── controls ───────────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 2rem 1rem;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .controls input[type="number"] {
      width: 110px;
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      border: 1px solid #2d3748;
      background: #1a1a2e;
      color: #e8e8ea;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .controls input[type="number"]:focus { border-color: #60a5fa; }

    .controls select {
      padding: 0.55rem 0.8rem;
      border-radius: 8px;
      border: 1px solid #2d3748;
      background: #1a1a2e;
      color: #e8e8ea;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .btn {
      padding: 0.6rem 1.6rem;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6d28d9);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── status bar ─────────────────────────────────────────── */
    #status {
      text-align: center;
      font-size: 0.87rem;
      color: #64748b;
      min-height: 1.4em;
      padding-bottom: 0.5rem;
    }

    #status.loading { color: #60a5fa; }
    #status.error   { color: #f87171; }

    /* ── grid ───────────────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
      padding: 0 2rem 3rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── card ───────────────────────────────────────────────── */
    .card {
      background: #14141f;
      border: 1px solid #1e2235;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: default;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }

    .card-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: #1e2235;
    }

    .card-poster-placeholder {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #1e2235;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3d4a5c;
      font-size: 3rem;
    }

    .card-body {
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      flex: 1;
    }

    .card-rank {
      font-size: 0.7rem;
      font-weight: 700;
      color: #6d28d9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.3;
      color: #f1f5f9;
    }

    .card-year {
      font-size: 0.8rem;
      color: #64748b;
    }

    .card-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .genre-tag {
      font-size: 0.68rem;
      background: #1e3a5f;
      color: #93c5fd;
      padding: 0.18rem 0.5rem;
      border-radius: 4px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 0.4rem;
      border-top: 1px solid #1e2235;
    }

    .card-rating {
      font-size: 0.82rem;
      color: #fbbf24;
      font-weight: 600;
    }

    .card-score {
      font-size: 0.75rem;
      color: #4ade80;
      font-weight: 600;
    }

    .card-overview {
      font-size: 0.78rem;
      color: #64748b;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── empty state ────────────────────────────────────────── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #3d4a5c;
      padding: 4rem 0;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

<header>
  <h1>🎬 Movie Recommender</h1>
  <p>Collaborative filtering with ALS · {{ num_users | format_number }} users · MovieLens + TMDB</p>
</header>

<div class="controls">
  <label for="uid">User ID</label>
  <input type="number" id="uid" value="10" min="0" max="{{ num_users - 1 }}" step="1" />

  <label for="n">Results</label>
  <select id="n">
    <option value="5">5</option>
    <option value="10" selected>10</option>
    <option value="15">15</option>
    <option value="20">20</option>
  </select>

  <button class="btn" id="go-btn" onclick="loadRecs()">Get Recommendations</button>
</div>

<p id="status"></p>

<div id="grid"><div class="empty">Enter a user ID and click Get Recommendations.</div></div>

<script>
  // allow pressing Enter in the input
  document.getElementById('uid').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadRecs();
  });

  async function loadRecs() {
    const uid   = document.getElementById('uid').value.trim();
    const n     = document.getElementById('n').value;
    const btn   = document.getElementById('go-btn');
    const status = document.getElementById('status');
    const grid   = document.getElementById('grid');

    if (uid === '') return;

    btn.disabled  = true;
    status.className = 'loading';
    status.textContent = 'Fetching recommendations…';
    grid.innerHTML = '';

    try {
      const res  = await fetch(`/api/recommend?user_id=${uid}&n=${n}`);
      const data = await res.json();

      if (!res.ok) {
        status.className = 'error';
        status.textContent = data.error || 'Something went wrong.';
        grid.innerHTML = `<div class="empty">${data.error || 'Error'}</div>`;
        return;
      }

      const movies = data.recommendations;
      status.className = '';
      status.textContent = `Showing ${movies.length} recommendations for user ${data.user_id}`;

      if (!movies.length) {
        grid.innerHTML = '<div class="empty">No recommendations found for this user.</div>';
        return;
      }

      grid.innerHTML = movies.map((m, i) => `
        <div class="card">
          ${m.poster_url
            ? `<img class="card-poster" src="${m.poster_url}" alt="${esc(m.title)}" loading="lazy" />`
            : `<div class="card-poster-placeholder">🎬</div>`}
          <div class="card-body">
            <span class="card-rank">#${i + 1}</span>
            <div class="card-title">${esc(m.title)}</div>
            <div class="card-year">${m.year || '—'}</div>
            <div class="card-genres">
              ${(m.genres || []).slice(0, 3).map(g => `<span class="genre-tag">${esc(g)}</span>`).join('')}
            </div>
            <div class="card-overview">${esc(m.overview)}</div>
            <div class="card-meta">
              <span class="card-rating">★ ${m.vote_average?.toFixed(1) ?? '—'}</span>
              <span class="card-score">ALS ${m.score.toFixed(3)}</span>
            </div>
          </div>
        </div>
      `).join('');

    } catch (err) {
      status.className = 'error';
      status.textContent = 'Network error — is the server running?';
      grid.innerHTML = '<div class="empty">Could not reach the server.</div>';
    } finally {
      btn.disabled = false;
    }
  }

  function esc(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>

</body>
</html>
